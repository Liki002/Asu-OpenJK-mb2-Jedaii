name: Build Linux Server (openjkded.i386)

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build openjkded.i386 in 32-bit Debian Container
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src i386/debian:bullseye bash -c "
            set -e
            apt-get update && apt-get install -y --no-install-recommends \
              build-essential cmake ninja-build git zlib1g-dev libjpeg-dev libpng-dev
            mkdir -p build-linux && cd build-linux
            cmake -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=i386 \
              -DCMAKE_C_COMPILER='/usr/bin/gcc' \
              -DCMAKE_CXX_COMPILER='/usr/bin/g++' \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DUseInternalJPEG=ON \
              -DUseInternalZlib=ON \
              -DUseInternalPNG=ON \
              -DBuildMPDed=ON \
              -DBuildMPGame=OFF \
              -DBuildMPCGame=OFF \
              -DBuildMPEngine=OFF \
              -DBuildMPRdVanilla=OFF \
              -DBuildMPUI=OFF \
              -DBuildSPEngine=OFF \
              -DBuildSPGame=OFF \
              -DBuildSPRdVanilla=OFF \
              -DBuildMPRend2=OFF \
              ..
            ninja openjkded.i386
            chmod 777 openjkded.i386
          "
          ls -la build-linux/openjkded.i386

      - name: Upload Server Binary
        uses: actions/upload-artifact@v4
        with:
          name: openjkded.i386
          path: build-linux/openjkded.i386
          if-no-files-found: error
