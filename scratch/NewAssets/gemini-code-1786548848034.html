<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Jedi Academy - Full Asset Suite Exporter</title>
  <style>
    body {
      background-color: #08090c;
      color: #e0e6ed;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      align-items: center;
      background: #12151d;
      padding: 15px 25px;
      border-radius: 8px;
      border: 1px solid #2a3245;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      flex-wrap: wrap;
    }

    select, button {
      padding: 10px 18px;
      background: #1e2538;
      color: #ff9900;
      border: 1px solid #ff9900;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
      outline: none;
    }

    button {
      background: #ff9900;
      color: #08090c;
      transition: all 0.2s ease;
    }

    button.batch-all-btn {
      background: #00e676;
      color: #08090c;
      border-color: #00e676;
    }

    button:hover {
      opacity: 0.85;
      box-shadow: 0 0 12px rgba(255, 153, 0, 0.5);
    }

    #export-wrapper {
      padding: 40px;
      background: #000000;
      border: 1px solid #2a3245;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .asset-item {
      display: none;
    }

    .asset-item.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="controls">
    <label for="asset-select">Select Asset:</label>
    <select id="asset-select" onchange="switchAsset(this.value)">
      <optgroup label="HUD Chassis (1024x512)">
        <option value="chassis_left">Left HUD Chassis</option>
        <option value="chassis_right">Right HUD Chassis</option>
      </optgroup>
      <optgroup label="Circle Frame Avatars (256x256)">
        <option value="avatar_hot_potato" selected>Avatar - Real Hot Potato 🔥🥔</option>

        <option value="avatar_sith">Avatar - Sith Empire</option>
        <option value="avatar_rebel">Avatar - Rebel Alliance</option>
        <option value="avatar_imperial">Avatar - Galactic Empire</option>
        <option value="avatar_mando">Avatar - Mandalorian Crest</option>
      </optgroup>
      <optgroup label="Bar Fills (512x64)">
        <option value="fill_health">Health Fill (Green)</option>
        <option value="fill_armor">Armor Fill (Blue)</option>
        <option value="fill_force">Force Fill (Purple)</option>
        <option value="fill_block">Block Fill (Solid Red)</option>
      </optgroup>
      <optgroup label="MBII ACM Sequence (Refined Kyber Crystal)">
        <option value="mb_acmglow0">mb_acmglow0 (Off / 0.0)</option>
        <option value="mb_acmglow1">mb_acmglow1 (Stage 1)</option>
        <option value="mb_acmglow2">mb_acmglow2 (Stage 2)</option>
        <option value="mb_acmglow3">mb_acmglow3 (Stage 3)</option>
        <option value="mb_acmglow4">mb_acmglow4 (Stage 4)</option>
        <option value="mb_acmglow5">mb_acmglow5 (Stage 5)</option>
        <option value="mb_acmglow6">mb_acmglow6 (Stage 6)</option>
        <option value="mb_acmglow7">mb_acmglow7 (Stage 7)</option>
        <option value="mb_acmglow8">mb_acmglow8 (Stage 8)</option>
        <option value="mb_acmglow9">mb_acmglow9 (Stage 9 / Max Overload)</option>

    <button onclick="exportCurrentPNG()">Export Active Asset</button>
    <button class="batch-all-btn" onclick="exportEverything()">⚡ BATCH EXPORT ALL ASSETS (22 FILES)</button>

  <script>
    const ALL_ASSETS = [
      'chassis_left', 'chassis_right',
      'avatar_hot_potato', 'avatar_jedi', 'avatar_sith', 'avatar_rebel', 'avatar_imperial', 'avatar_mando',
      'fill_health', 'fill_armor', 'fill_force', 'fill_block',
      'mb_acmglow0', 'mb_acmglow1', 'mb_acmglow2', 'mb_acmglow3', 'mb_acmglow4',
      'mb_acmglow5', 'mb_acmglow6', 'mb_acmglow7', 'mb_acmglow8', 'mb_acmglow9'
    ];

    function switchAsset(assetId) {
      document.querySelectorAll('.asset-item').forEach(item => item.classList.remove('active'));
      const activeItem = document.getElementById(assetId);
      if (activeItem) activeItem.classList.add('active');
    }

    function exportSVGToPNG(svgElement, fileName) {
      return new Promise((resolve) => {
        const width = parseInt(svgElement.getAttribute('width'), 10);
        const height = parseInt(svgElement.getAttribute('height'), 10);
        const serializer = new XMLSerializer();
        const svgString = serializer.serializeToString(svgElement);

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');

        const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        const URL = window.URL || window.webkitURL || window;
        const blobURL = URL.createObjectURL(svgBlob);

        const image = new Image();
        image.onload = function() {
          ctx.drawImage(image, 0, 0, width, height);
          const pngUrl = canvas.toDataURL('image/png');

          const link = document.createElement('a');
          link.href = pngUrl;
          link.download = `${fileName}.png`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(blobURL);
          resolve();
        };
        image.src = blobURL;
      });
    }

    function exportCurrentPNG() {
      const selectedId = document.getElementById('asset-select').value;
      const svgElement = document.getElementById(selectedId);
      exportSVGToPNG(svgElement, selectedId);
    }

    async function exportEverything() {
      for (const assetId of ALL_ASSETS) {
        const svgElement = document.getElementById(assetId);
        if (svgElement) {
          await exportSVGToPNG(svgElement, assetId);
          await new Promise(r => setTimeout(r, 200));
        }
      }
    }
  </script>
