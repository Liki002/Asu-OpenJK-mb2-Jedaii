<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sci-Fi UI Vector Exporter Studio</title>
  <style>
    body {
      background-color: #08090c;
      color: #e0e6ed;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      align-items: center;
      background: #12151d;
      padding: 15px 25px;
      border-radius: 8px;
      border: 1px solid #2a3245;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      flex-wrap: wrap;
    }

    select, button {
      padding: 10px 18px;
      background: #1e2538;
      color: #ffb400;
      border: 1px solid #ffb400;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
      outline: none;
    }

    button {
      background: #ffb400;
      color: #08090c;
      transition: all 0.2s ease;
    }

    button.batch-all-btn {
      background: #00e676;
      color: #08090c;
      border-color: #00e676;
    }

    button:hover {
      background: #ffd060;
      box-shadow: 0 0 10px rgba(255, 180, 0, 0.4);
    }
    
    button.batch-all-btn:hover {
      background: #66ffa6;
      box-shadow: 0 0 10px rgba(0, 230, 118, 0.4);
    }

    #export-wrapper {
      padding: 20px;
      background: repeating-conic-gradient(#10141e 0% 25%, #181d2b 0% 50%) 50% / 20px 20px;
      border: 1px solid #2a3245;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #ui-container {
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .asset-item {
      display: none;
    }

    .asset-item.active {
      display: block;
    }
  </style>
</head>
<body>

  <div class="controls">
    <label for="asset-select">Select UI Asset:</label>
    <select id="asset-select" onchange="switchAsset(this.value)">
      <optgroup label="Panels & Backgrounds">
        <option value="ach_bg">ach_bg (Achievements Panel)</option>
        <option value="adv_bg">adv_bg (Adventure Panel - Wide)</option>
        <option value="inventory_bg">inventory_bg (Inventory Panel - Compact Sidebar)</option>
        <option value="leaderboard_bg">leaderboard_bg (Leaderboard Panel - Clean)</option>
        <option value="quest_bg">quest_bg (Quest List Panel - 3 Quests)</option>
        <option value="shop_bg">shop_bg (Shop Panel)</option>
        <option value="top_bg">top_bg (Top 10 Duelist - Vertical)</option>
        <option value="wanted_bg">wanted_bg (Wanted / Bounty Panel)</option>
        <option value="stats_card" selected>stats_card (Player Stats Card)</option>
        <option value="toast_bg">toast_bg (Victory/Defeat Notification Banner)</option>
        <option value="inspect_bg">inspect_bg (Inspect Player Info Panel)</option>
      </optgroup>
      <optgroup label="HUD Config Panel Elements">
        <option value="hud_settings_bg">hud_settings_bg (HUD Settings Panel Frame)</option>
        <option value="hud_btn_normal">hud_btn_normal (Button - Normal State)</option>
        <option value="hud_btn_hover">hud_btn_hover (Button - Hover State)</option>
        <option value="hud_slider_track">hud_slider_track (Slider Track)</option>
        <option value="hud_slider_thumb">hud_slider_thumb (Slider Knob)</option>
      </optgroup>
      <optgroup label="Profile & XP Panels">
        <option value="panel_bg">panel_bg (Profile Bar V1)</option>
        <option value="panel_bg_fill_v1">panel_bg_fill_v1 (XP Fill Bar V1)</option>
        <option value="panel_bg_v2">panel_bg_v2 (Profile Bar V2 - Heavy Tech)</option>
        <option value="panel_bg_fill_v2">panel_bg_fill_v2 (XP Fill Bar V2)</option>
        <option value="panel_bg_v3">panel_bg_v3 (Profile Bar V3 - Minimal Glow)</option>
        <option value="panel_bg_fill_v3">panel_bg_fill_v3 (XP Fill Bar V3)</option>
      </optgroup>
      <optgroup label="Avatars & Frames">
        <option value="avatar_default">avatar_default (Default Player Avatar)</option>
        <option value="avatar_frame">avatar_frame (Avatar Border Frame)</option>
      </optgroup>
      <optgroup label="Bars & Buttons">
        <option value="bar_bg">bar_bg (Empty Bar Track)</option>
        <option value="bar_fill">bar_fill (Filled Bar Indicator)</option>
        <option value="buy_btn">buy_btn (Buy Action Button)</option>
        <option value="sell_btn">sell_btn (Sell Action Button)</option>
        <option value="use_btn">use_btn (Use Action Button)</option>
      </optgroup>
      <optgroup label="Custom Mouse Cursor">
        <option value="rpg_mouse">rpg_mouse (Custom Sci-Fi Mouse Cursor)</option>
      </optgroup>
    </select>

    <button onclick="exportCurrentPNG()">Export Selected Asset PNG</button>
    <button class="batch-all-btn" onclick="exportEverything()">⚡ Batch Export All Assets</button>
  </div>

  <div class="controls" id="customizer-options" style="display: none; background: #12151d; border: 1px solid #2a3245; border-radius: 8px; padding: 15px 25px; margin-bottom: 25px; max-width: 600px; width: 100%; box-shadow: 0 4px 20px rgba(0,0,0,0.5);">
    <h3 style="color: #ffb400; margin-bottom: 12px; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1px; width: 100%;">Customize Live Render Options</h3>
    
    <!-- Cursor Customization Options -->
    <div id="cursor-opts" style="display: none; width: 100%;">
      <div style="display: flex; gap: 20px; flex-wrap: wrap;">
        <div>
          <label style="display: block; font-size: 0.75rem; margin-bottom: 6px; color: #8a99ad; font-weight: bold; letter-spacing: 1px;">ACCENT GLOW COLOR</label>
          <select id="cursor-color" onchange="updateCursorCustomization()" style="padding: 6px 12px; font-size: 0.85rem;">
            <option value="#00d2ff" selected>Cyan (#00d2ff)</option>
            <option value="#ff3366">Red (#ff3366)</option>
            <option value="#39ff14">Green (#39ff14)</option>
            <option value="#ffaa00">Gold (#ffaa00)</option>
            <option value="#9d4edd">Purple (#9d4edd)</option>
          </select>
        </div>
        <div>
          <label style="display: block; font-size: 0.75rem; margin-bottom: 6px; color: #8a99ad; font-weight: bold; letter-spacing: 1px;">VECTOR STYLE</label>
          <select id="cursor-style" onchange="updateCursorCustomization()" style="padding: 6px 12px; font-size: 0.85rem;">
            <option value="crosshair" selected>Sci-Fi Crosshair</option>
            <option value="arrow">Precision Arrow</option>
            <option value="ring">Targeting Ring</option>
            <option value="minimal">Tech Dot</option>
            <option value="stealth">Stealth Fighter</option>
            <option value="laser">Laser Scope</option>
            <option value="bio">Tri-Biohazard</option>
            <option value="orbit">Orbit Ring</option>
          </select>
        </div>
      </div>
    </div>

    <!-- HUD Configuration Options -->
    <div id="hud-opts" style="display: none; width: 100%;">
      <div style="display: flex; gap: 20px; flex-wrap: wrap;">
        <div>
          <label style="display: block; font-size: 0.75rem; margin-bottom: 6px; color: #8a99ad; font-weight: bold; letter-spacing: 1px;">HUD ELEMENT COLOR</label>
          <select id="hud-color" onchange="updateHUDCustomization()" style="padding: 6px 12px; font-size: 0.85rem;">
            <option value="#00d2ff" selected>Cyan (#00d2ff)</option>
            <option value="#ff3366">Red (#ff3366)</option>
            <option value="#39ff14">Green (#39ff14)</option>
            <option value="#ffaa00">Gold (#ffaa00)</option>
            <option value="#9d4edd">Purple (#9d4edd)</option>
          </select>
        </div>
        <div>
          <label style="display: block; font-size: 0.75rem; margin-bottom: 6px; color: #8a99ad; font-weight: bold; letter-spacing: 1px;">HUD STYLE</label>
          <select id="hud-style" onchange="updateHUDCustomization()" style="padding: 6px 12px; font-size: 0.85rem;">
            <option value="tech" selected>Tech Hex</option>
            <option value="minimal">Minimalist</option>
            <option value="industrial">Industrial</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ALL_ASSETS = [
      'ach_bg', 'adv_bg', 'inventory_bg', 'leaderboard_bg', 'quest_bg', 'stats_card',
      'toast_bg', 'inspect_bg', 'panel_bg', 'panel_bg_fill_v1', 'panel_bg_v2',
      'panel_bg_fill_v2', 'panel_bg_v3', 'panel_bg_fill_v3', 'shop_bg', 'top_bg',
      'wanted_bg', 'avatar_default', 'avatar_frame', 'bar_bg', 'bar_fill',
      'buy_btn', 'sell_btn', 'use_btn', 'rpg_mouse',
      'hud_settings_bg', 'hud_btn_normal', 'hud_btn_hover', 'hud_slider_track', 'hud_slider_thumb'
    ];

    function switchAsset(assetId) {
      const items = document.querySelectorAll('.asset-item');
      items.forEach(item => item.classList.remove('active'));
      
      const activeItem = document.getElementById(assetId);
      if (activeItem) {
        activeItem.classList.add('active');
      }

      // Show customizer options panels based on selection
      const customPanel = document.getElementById('customizer-options');
      const cursorOpts = document.getElementById('cursor-opts');
      const hudOpts = document.getElementById('hud-opts');

      if (assetId === 'rpg_mouse') {
        customPanel.style.display = 'block';
        cursorOpts.style.display = 'block';
        hudOpts.style.display = 'none';
        updateCursorCustomization();
      } else if (assetId.startsWith('hud_')) {
        customPanel.style.display = 'block';
        cursorOpts.style.display = 'none';
        hudOpts.style.display = 'block';
        updateHUDCustomization();
      } else {
        customPanel.style.display = 'none';
      }
    }

    function updateCursorCustomization() {
      const color = document.getElementById('cursor-color').value;
      const style = document.getElementById('cursor-style').value;
      
      const mouseSvg = document.getElementById('rpg_mouse');
      mouseSvg.style.color = color;
      
      // Toggle visibility of specific vector paths inside SVG
      const groups = mouseSvg.querySelectorAll('.cursor-style-group');
      groups.forEach(g => g.style.display = 'none');
      
      const targetGroup = document.getElementById(`cursor-style-${style}`);
      if (targetGroup) {
        targetGroup.style.display = 'block';
      }
    }

    function updateHUDCustomization() {
      const color = document.getElementById('hud-color').value;
      const style = document.getElementById('hud-style').value;
      const selectedId = document.getElementById('asset-select').value;
      
      const hudSvg = document.getElementById(selectedId);
      if (hudSvg) {
        hudSvg.style.color = color;
        
        // Dynamic preview style switching for hud_settings_bg SVG
        if (selectedId === 'hud_settings_bg') {
          const groups = hudSvg.querySelectorAll('.hud-style-group');
          groups.forEach(g => g.style.display = 'none');
          
          const targetGroup = document.getElementById(`hud-style-${style}`);
          if (targetGroup) {
            targetGroup.style.display = 'block';
          }
        }
      }
    }

    function exportSVGToPNG(svgElement, fileName) {
      return new Promise((resolve) => {
        const scale = 2; // High-resolution output factor
        const width = svgElement.getAttribute('width') * scale;
        const height = svgElement.getAttribute('height') * scale;

        const serializer = new XMLSerializer();
        const svgString = serializer.serializeToString(svgElement);

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');

        const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
        const URL = window.URL || window.webkitURL || window;
        const blobURL = URL.createObjectURL(svgBlob);

        const image = new Image();
        image.onload = function() {
          ctx.drawImage(image, 0, 0, width, height);
          const pngUrl = canvas.toDataURL('image/png');

          const link = document.createElement('a');
          link.href = pngUrl;
          link.download = `${fileName}.png`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(blobURL);
          resolve();
        };

        image.src = blobURL;
      });
    }

    function exportCurrentPNG() {
      const selectedId = document.getElementById('asset-select').value;
      const svgElement = document.getElementById(selectedId);
      exportSVGToPNG(svgElement, selectedId);
    }

    async function exportEverything() {
      for (const assetId of ALL_ASSETS) {
        const svgElement = document.getElementById(assetId);
        if (svgElement) {
          await exportSVGToPNG(svgElement, assetId);
          // Small delay to ensure browser sequential downloads trigger cleanly
          await new Promise(r => setTimeout(r, 250));
        }
      }
    }
  </script>
