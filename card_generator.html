<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>52 Playing Cards Asset Generator & Exporter</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --accent: #e5a93b;
    --accent-glow: rgba(229, 169, 59, 0.4);
    --text: #c9d1d9;
    --text-bright: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: 24px;
  }
  header {
    max-width: 1200px;
    margin: 0 auto 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 20px;
  }
  h1 {
    font-size: 24px;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .btn {
    background: #21262d;
    color: var(--text-bright);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .btn:hover {
    background: #30363d;
    border-color: #8b949e;
  }
  .btn-primary {
    background: linear-gradient(135deg, #d29922 0%, #b07d10 100%);
    color: #000;
    border: none;
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .btn-primary:hover {
    background: linear-gradient(135deg, #e5a93b 0%, #c48c18 100%);
    box-shadow: 0 0 18px rgba(229, 169, 59, 0.6);
    transform: translateY(-1px);
  }
  select, input {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-bright);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
  }
  .status-bar {
    max-width: 1200px;
    margin: 0 auto 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 12px 18px;
    border-radius: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
  }
  .progress-wrap {
    width: 250px;
    height: 8px;
    background: #21262d;
    border-radius: 4px;
    overflow: hidden;
    display: none;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.1s ease;
  }
  .grid {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 16px;
  }
  .card-container {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .card-container:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
  }
  canvas {
    width: 110px;
    height: 154px;
    border-radius: 6px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }
  .card-label {
    font-size: 12px;
    font-weight: 600;
    color: #8b949e;
  }
  .btn-download-single {
    background: #21262d;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
  }
  .btn-download-single:hover {
    background: var(--accent);
    color: #000;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>♠ Canto Bight 52 Cards Asset Exporter</h1>
    <p style="font-size: 13px; color: #8b949e; margin-top: 4px;">High quality 52-card deck PNG exporter for Movie Battles II & Ranked UI</p>
  </div>
  <div class="controls">
    <label style="font-size: 13px; color: #8b949e;">Theme:</label>
    <select id="themeSelect" onchange="renderAllCards()">
      <option value="cantina" selected>Canto Bight Casino (Gold/Dark)</option>
      <option value="classic">Classic Crisp Playing Cards</option>
      <option value="scifi">Cyber / Imperial Holo Blue</option>
    </select>

    <label style="font-size: 13px; color: #8b949e;">Resolution:</label>
    <select id="resSelect" onchange="renderAllCards()">
      <option value="256" selected>256 x 358 (Standard Game HD)</option>
      <option value="512">512 x 716 (Ultra 4K HD)</option>
      <option value="128">128 x 179 (Classic Low-Res)</option>
    </select>

    <button class="btn btn-primary" id="btnZipAll" onclick="exportZipAll()">
      <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3z"/></svg>
      Export All 52 Cards (.ZIP)
    </button>
  </div>
</header>

<div class="status-bar">
  <span id="statusText">Ready to export 52 cards (Hearts, Diamonds, Clubs, Spades + Card Back).</span>
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>
</div>

<div class="grid" id="cardGrid"></div>

<script>
const SUITS = [
  { name: 'hearts', symbol: '♥', color: '#e63946', isRed: true },
  { name: 'diamonds', symbol: '♦', color: '#e63946', isRed: true },
  { name: 'clubs', symbol: '♣', color: '#2b2d42', isRed: false },
  { name: 'spades', symbol: '♠', color: '#2b2d42', isRed: false }
];

const VALUES = [
  { val: 1, label: 'A', name: 'Ace' },
  { val: 2, label: '2', name: '2' },
  { val: 3, label: '3', name: '3' },
  { val: 4, label: '4', name: '4' },
  { val: 5, label: '5', name: '5' },
  { val: 6, label: '6', name: '6' },
  { val: 7, label: '7', name: '7' },
  { val: 8, label: '8', name: '8' },
  { val: 9, label: '9', name: '9' },
  { val: 10, label: '10', name: '10' },
  { val: 11, label: 'J', name: 'Jack' },
  { val: 12, label: 'Q', name: 'Queen' },
  { val: 13, label: 'K', name: 'King' }
];

const cardCanvases = {};

function roundRect(ctx, x, y, width, height, radius) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + width - radius, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
  ctx.lineTo(x + width, y + height - radius);
  ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  ctx.lineTo(x + radius, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
}

function drawCard(canvas, suit, valObj, theme) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  const r = w * 0.08;

  ctx.clearRect(0, 0, w, h);

  // Card Background
  roundRect(ctx, 4, 4, w - 8, h - 8, r);
  
  if (theme === 'cantina') {
    // Dark luxury Canto Bight casino theme
    const bgGrad = ctx.createLinearGradient(0, 0, w, h);
    bgGrad.addColorStop(0, '#1c1f26');
    bgGrad.addColorStop(1, '#0e1015');
    ctx.fillStyle = bgGrad;
    ctx.fill();

    // Gold / Silver Metallic Border
    ctx.lineWidth = Math.max(2, w * 0.02);
    ctx.strokeStyle = suit.isRed ? '#e5a93b' : '#a0aec0';
    ctx.stroke();

    // Inner subtle border
    roundRect(ctx, 10, 10, w - 20, h - 20, r * 0.7);
    ctx.lineWidth = 1;
    ctx.strokeStyle = suit.isRed ? 'rgba(229, 169, 59, 0.25)' : 'rgba(160, 174, 192, 0.25)';
    ctx.stroke();

  } else if (theme === 'classic') {
    // Crisp physical playing card
    const bgGrad = ctx.createLinearGradient(0, 0, w, h);
    bgGrad.addColorStop(0, '#ffffff');
    bgGrad.addColorStop(1, '#f0f2f5');
    ctx.fillStyle = bgGrad;
    ctx.fill();

    ctx.lineWidth = Math.max(2, w * 0.015);
    ctx.strokeStyle = '#cbd5e1';
    ctx.stroke();

  } else if (theme === 'scifi') {
    // Sci-fi Holo
    const bgGrad = ctx.createLinearGradient(0, 0, w, h);
    bgGrad.addColorStop(0, '#061325');
    bgGrad.addColorStop(1, '#020912');
    ctx.fillStyle = bgGrad;
    ctx.fill();

    ctx.lineWidth = Math.max(2, w * 0.02);
    ctx.strokeStyle = suit.isRed ? '#ff0055' : '#00d2ff';
    ctx.shadowColor = suit.isRed ? '#ff0055' : '#00d2ff';
    ctx.shadowBlur = 8;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // Draw Suit and Rank Values
  let textColor;
  if (theme === 'cantina') {
    textColor = suit.isRed ? '#ff4d6d' : '#f8f9fa';
  } else if (theme === 'classic') {
    textColor = suit.isRed ? '#dc2626' : '#1e293b';
  } else {
    textColor = suit.isRed ? '#ff2a6d' : '#05d9e8';
  }

  ctx.fillStyle = textColor;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Top Left Rank & Suit
  const cornerFontSize = Math.round(w * 0.14);
  const symbolFontSize = Math.round(w * 0.11);
  ctx.font = `bold ${cornerFontSize}px -apple-system, sans-serif`;
  ctx.fillText(valObj.label, w * 0.18, h * 0.14);

  ctx.font = `${symbolFontSize}px -apple-system, sans-serif`;
  ctx.fillText(suit.symbol, w * 0.18, h * 0.23);

  // Bottom Right Rank & Suit (Upside Down)
  ctx.save();
  ctx.translate(w * 0.82, h * 0.86);
  ctx.rotate(Math.PI);
  ctx.font = `bold ${cornerFontSize}px -apple-system, sans-serif`;
  ctx.fillText(valObj.label, 0, 0);
  ctx.font = `${symbolFontSize}px -apple-system, sans-serif`;
  ctx.fillText(suit.symbol, 0, h * 0.09);
  ctx.restore();

  // Center Graphics
  if (valObj.val >= 11) {
    // Face Card Emblem (J, Q, K)
    ctx.save();
    ctx.translate(w * 0.5, h * 0.5);

    // Frame
    roundRect(ctx, -w * 0.25, -h * 0.22, w * 0.5, h * 0.44, r * 0.5);
    ctx.fillStyle = theme === 'classic' ? 'rgba(0,0,0,0.04)' : 'rgba(255,255,255,0.04)';
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = theme === 'classic' ? 'rgba(0,0,0,0.1)' : 'rgba(255,255,255,0.15)';
    ctx.stroke();

    ctx.font = `bold ${Math.round(w * 0.26)}px serif`;
    ctx.fillStyle = textColor;
    ctx.fillText(valObj.label, 0, -h * 0.04);

    ctx.font = `${Math.round(w * 0.22)}px -apple-system, sans-serif`;
    ctx.fillText(suit.symbol, 0, h * 0.09);
    ctx.restore();

  } else if (valObj.val === 1) {
    // Ace Giant Center Symbol
    ctx.font = `bold ${Math.round(w * 0.42)}px -apple-system, sans-serif`;
    ctx.fillText(suit.symbol, w * 0.5, h * 0.5);
  } else {
    // Number Cards Pattern
    ctx.font = `${Math.round(w * 0.22)}px -apple-system, sans-serif`;
    const count = valObj.val;

    if (count === 2) {
      ctx.fillText(suit.symbol, w * 0.5, h * 0.38);
      ctx.fillText(suit.symbol, w * 0.5, h * 0.62);
    } else if (count === 3) {
      ctx.fillText(suit.symbol, w * 0.5, h * 0.35);
      ctx.fillText(suit.symbol, w * 0.5, h * 0.50);
      ctx.fillText(suit.symbol, w * 0.5, h * 0.65);
    } else if (count === 4) {
      ctx.fillText(suit.symbol, w * 0.38, h * 0.38);
      ctx.fillText(suit.symbol, w * 0.62, h * 0.38);
      ctx.fillText(suit.symbol, w * 0.38, h * 0.62);
      ctx.fillText(suit.symbol, w * 0.62, h * 0.62);
    } else if (count === 5) {
      ctx.fillText(suit.symbol, w * 0.38, h * 0.38);
      ctx.fillText(suit.symbol, w * 0.62, h * 0.38);
      ctx.fillText(suit.symbol, w * 0.50, h * 0.50);
      ctx.fillText(suit.symbol, w * 0.38, h * 0.62);
      ctx.fillText(suit.symbol, w * 0.62, h * 0.62);
    } else if (count === 6) {
      ctx.fillText(suit.symbol, w * 0.38, h * 0.36);
      ctx.fillText(suit.symbol, w * 0.62, h * 0.36);
      ctx.fillText(suit.symbol, w * 0.38, h * 0.50);
      ctx.fillText(suit.symbol, w * 0.62, h * 0.50);
      ctx.fillText(suit.symbol, w * 0.38, h * 0.64);
      ctx.fillText(suit.symbol, w * 0.62, h * 0.64);
    } else if (count === 7) {
      ctx.fillText(suit.symbol, w * 0.38, h * 0.36);
      ctx.fillText(suit.symbol, w * 0.62, h * 0.36);
      ctx.fillText(suit.symbol, w * 0.50, h * 0.43);
      ctx.fillText(suit.symbol, w * 0.38, h * 0.50);
      ctx.fillText(suit.symbol, w * 0.62, h * 0.50);
      ctx.fillText(suit.symbol, w * 0.38, h * 0.64);
      ctx.fillText(suit.symbol, w * 0.62, h * 0.64);
    } else if (count === 8) {
      ctx.fillText(suit.symbol, w * 0.38, h * 0.34);
      ctx.fillText(suit.symbol, w * 0.62, h * 0.34);
      ctx.fillText(suit.symbol, w * 0.50, h * 0.42);
      ctx.fillText(suit.symbol, w * 0.38, h * 0.50);
      ctx.fillText(suit.symbol, w * 0.62, h * 0.50);
      ctx.fillText(suit.symbol, w * 0.50, h * 0.58);
      ctx.fillText(suit.symbol, w * 0.38, h * 0.66);
      ctx.fillText(suit.symbol, w * 0.62, h * 0.66);
    } else if (count === 9) {
      ctx.fillText(suit.symbol, w * 0.38, h * 0.33);
      ctx.fillText(suit.symbol, w * 0.62, h * 0.33);
      ctx.fillText(suit.symbol, w * 0.38, h * 0.44);
      ctx.fillText(suit.symbol, w * 0.62, h * 0.44);
      ctx.fillText(suit.symbol, w * 0.50, h * 0.50);
      ctx.fillText(suit.symbol, w * 0.38, h * 0.56);
      ctx.fillText(suit.symbol, w * 0.62, h * 0.56);
      ctx.fillText(suit.symbol, w * 0.38, h * 0.67);
      ctx.fillText(suit.symbol, w * 0.62, h * 0.67);
    } else if (count === 10) {
      ctx.fillText(suit.symbol, w * 0.38, h * 0.33);
      ctx.fillText(suit.symbol, w * 0.62, h * 0.33);
      ctx.fillText(suit.symbol, w * 0.50, h * 0.40);
      ctx.fillText(suit.symbol, w * 0.38, h * 0.46);
      ctx.fillText(suit.symbol, w * 0.62, h * 0.46);
      ctx.fillText(suit.symbol, w * 0.38, h * 0.54);
      ctx.fillText(suit.symbol, w * 0.62, h * 0.54);
      ctx.fillText(suit.symbol, w * 0.50, h * 0.60);
      ctx.fillText(suit.symbol, w * 0.38, h * 0.67);
      ctx.fillText(suit.symbol, w * 0.62, h * 0.67);
    }
  }
}

function drawCardBack(canvas, theme) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  const r = w * 0.08;

  ctx.clearRect(0, 0, w, h);
  roundRect(ctx, 4, 4, w - 8, h - 8, r);

  if (theme === 'cantina') {
    const bg = ctx.createLinearGradient(0, 0, w, h);
    bg.addColorStop(0, '#741d26');
    bg.addColorStop(1, '#3b0d12');
    ctx.fillStyle = bg;
    ctx.fill();

    ctx.lineWidth = Math.max(2, w * 0.02);
    ctx.strokeStyle = '#e5a93b';
    ctx.stroke();

    // Geometric pattern
    roundRect(ctx, 14, 14, w - 28, h - 28, r * 0.6);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(229, 169, 59, 0.4)';
    ctx.stroke();

    ctx.fillStyle = '#e5a93b';
    ctx.font = `bold ${Math.round(w * 0.35)}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('◈', w * 0.5, h * 0.5);

  } else if (theme === 'classic') {
    ctx.fillStyle = '#1e3a8a';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();

    roundRect(ctx, 12, 12, w - 24, h - 24, r * 0.6);
    ctx.lineWidth = 2;
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${Math.round(w * 0.32)}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🎴', w * 0.5, h * 0.5);

  } else {
    ctx.fillStyle = '#05192d';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#00f0ff';
    ctx.shadowColor = '#00f0ff';
    ctx.shadowBlur = 10;
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#00f0ff';
    ctx.font = `bold ${Math.round(w * 0.35)}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⎔', w * 0.5, h * 0.5);
  }
}

function renderAllCards() {
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';

  const theme = document.getElementById('themeSelect').value;
  const res = parseInt(document.getElementById('resSelect').value, 10);
  const w = res;
  const h = Math.round(res * 1.4);

  // Render 52 Cards
  SUITS.forEach(suit => {
    VALUES.forEach(valObj => {
      const cardKey = `card_${suit.name}_${valObj.label}`;

      const wrap = document.createElement('div');
      wrap.className = 'card-container';

      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      drawCard(canvas, suit, valObj, theme);
      cardCanvases[cardKey] = { canvas, filename: `${cardKey}.png` };

      const label = document.createElement('div');
      label.className = 'card-label';
      label.innerText = `${valObj.label} ${suit.symbol} (${valObj.name})`;

      const btn = document.createElement('button');
      btn.className = 'btn-download-single';
      btn.innerText = 'Download PNG';
      btn.onclick = () => {
        canvas.toBlob(blob => {
          saveAs(blob, `${cardKey}.png`);
        });
      };

      wrap.appendChild(canvas);
      wrap.appendChild(label);
      wrap.appendChild(btn);
      grid.appendChild(wrap);
    });
  });

  // Render Card Back
  const backWrap = document.createElement('div');
  backWrap.className = 'card-container';
  const backCanvas = document.createElement('canvas');
  backCanvas.width = w;
  backCanvas.height = h;
  drawCardBack(backCanvas, theme);
  cardCanvases['card_back'] = { canvas: backCanvas, filename: `card_back.png` };

  const backLabel = document.createElement('div');
  backLabel.className = 'card-label';
  backLabel.innerText = 'Card Back';

  const backBtn = document.createElement('button');
  backBtn.className = 'btn-download-single';
  backBtn.innerText = 'Download PNG';
  backBtn.onclick = () => {
    backCanvas.toBlob(blob => {
      saveAs(blob, `card_back.png`);
    });
  };

  backWrap.appendChild(backCanvas);
  backWrap.appendChild(backLabel);
  backWrap.appendChild(backBtn);
  grid.appendChild(backWrap);
}

async function exportZipAll() {
  const btn = document.getElementById('btnZipAll');
  const statusText = document.getElementById('statusText');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');

  btn.disabled = true;
  progressWrap.style.display = 'block';
  statusText.innerText = 'Generating 52 PNG card assets into ZIP...';

  const zip = new JSZip();
  const folder = zip.folder("playing_cards_52");

  const keys = Object.keys(cardCanvases);
  const total = keys.length;
  let done = 0;

  for (const key of keys) {
    const item = cardCanvases[key];
    const blob = await new Promise(resolve => item.canvas.toBlob(resolve, 'image/png'));
    folder.file(item.filename, blob);
    done++;
    const pct = Math.round((done / total) * 100);
    progressBar.style.width = pct + '%';
    statusText.innerText = `Adding card assets to ZIP: ${done}/${total} (${pct}%)`;
  }

  statusText.innerText = 'Compressing and downloading ZIP package...';
  const content = await zip.generateAsync({ type: 'blob' }, metadata => {
    progressBar.style.width = metadata.percent + '%';
  });

  const theme = document.getElementById('themeSelect').value;
  saveAs(content, `cards_52_${theme}_assets.zip`);

  statusText.innerText = `Export complete! Downloaded 53 card assets (52 cards + card back).`;
  btn.disabled = false;
  setTimeout(() => { progressWrap.style.display = 'none'; }, 2000);
}

// Initial render
window.onload = () => {
  renderAllCards();
};
</script>
</body>
</html>
