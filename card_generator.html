<script>
const allAssetCanvases = {};

function switchTab(tabId) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(tabId).classList.add('active');
}

function roundRect(ctx, x, y, width, height, radius) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + width - radius, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
  ctx.lineTo(x + width, y + height - radius);
  ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  ctx.lineTo(x + radius, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
}

// =============================================================================
// CHIPS RENDERER
// =============================================================================
const CHIP_DEFS = [
  { id: 'chip_10',  label: '10',  sub: '+10 CR',  mainCol: '#1e40af', edgeCol: '#3b82f6', accentCol: '#ffffff', gold: '#e5a93b' },
  { id: 'chip_25',  label: '25',  sub: '+25 CR',  mainCol: '#15803d', edgeCol: '#22c55e', accentCol: '#ffffff', gold: '#e5a93b' },
  { id: 'chip_50',  label: '50',  sub: '+50 CR',  mainCol: '#b91c1c', edgeCol: '#ef4444', accentCol: '#ffffff', gold: '#e5a93b' },
  { id: 'chip_100', label: '100', sub: '+100 CR', mainCol: '#111827', edgeCol: '#374151', accentCol: '#e5a93b', gold: '#f59e0b' },
  { id: 'chip_500', label: '500', sub: '+500 CR', mainCol: '#6b21a8', edgeCol: '#a855f7', accentCol: '#ffffff', gold: '#e5a93b' },
  { id: 'chip_clear', label: 'CLR', sub: 'CLEAR BET', mainCol: '#7f1d1d', edgeCol: '#991b1b', accentCol: '#fca5a5', gold: '#f87171' }
];

function drawChip(canvas, def) {
  const ctx = canvas.getContext('2d');
  const size = canvas.width;
  const cx = size / 2;
  const cy = size / 2;
  const radius = size * 0.46;

  ctx.clearRect(0, 0, size, size);

  // Outer drop shadow
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy + size * 0.02, radius, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fill();
  ctx.restore();

  // Outer Rim (Base Color)
  const outerGrad = ctx.createLinearGradient(0, 0, size, size);
  outerGrad.addColorStop(0, def.edgeCol);
  outerGrad.addColorStop(1, def.mainCol);
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fillStyle = outerGrad;
  ctx.fill();

  // Outer Edge Notches (8 inserts around the rim)
  const notches = 8;
  for (let i = 0; i < notches; i++) {
    const angle = (i * Math.PI * 2) / notches;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);

    ctx.beginPath();
    ctx.arc(0, -radius, radius * 0.12, 0, Math.PI * 2);
    ctx.fillStyle = def.accentCol;
    ctx.fill();
    ctx.restore();
  }

  // Inner Grooved Track
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 0.82, 0, Math.PI * 2);
  ctx.lineWidth = size * 0.025;
  ctx.strokeStyle = def.gold;
  ctx.stroke();

  // Concentric Inner Dashed Pattern
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 0.72, 0, Math.PI * 2);
  ctx.setLineDash([size * 0.04, size * 0.03]);
  ctx.lineWidth = size * 0.015;
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.stroke();
  ctx.setLineDash([]);

  // Center Inlay Disk
  const centerGrad = ctx.createRadialGradient(cx, cy * 0.9, radius * 0.1, cx, cy, radius * 0.65);
  centerGrad.addColorStop(0, '#1f2937');
  centerGrad.addColorStop(1, '#0b0f17');
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 0.62, 0, Math.PI * 2);
  ctx.fillStyle = centerGrad;
  ctx.fill();

  // Gold Center Ring
  ctx.beginPath();
  ctx.arc(cx, cy, radius * 0.62, 0, Math.PI * 2);
  ctx.lineWidth = size * 0.03;
  ctx.strokeStyle = def.gold;
  ctx.stroke();

  // Star / Emblem Motif Top & Bottom
  ctx.fillStyle = def.gold;
  ctx.font = `bold ${Math.round(size * 0.07)}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('★ CANTO BIGHT ★', cx, cy - radius * 0.36);
  ctx.fillText('◆ CREDITS ◆', cx, cy + radius * 0.38);

  // Center Value Text
  ctx.fillStyle = def.accentCol;
  ctx.font = `bold ${Math.round(size * 0.22)}px -apple-system, sans-serif`;
  ctx.shadowColor = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur = 6;
  ctx.fillText(def.label, cx, cy + size * 0.01);
  ctx.shadowBlur = 0;
}

function renderChipsTab() {
  const grid = document.getElementById('chipsGrid');
  grid.innerHTML = '';

  CHIP_DEFS.forEach(def => {
    const wrap = document.createElement('div');
    wrap.className = 'asset-card';

    const canvas = document.createElement('canvas');
    canvas.className = 'preview-chip';
    canvas.width = 256;
    canvas.height = 256;
    drawChip(canvas, def);

    const filename = `${def.id}.png`;
    allAssetCanvases[def.id] = { canvas, filename, folder: 'chips' };

    const label = document.createElement('div');
    label.className = 'asset-label';
    label.innerText = def.sub;

    const btn = document.createElement('button');
    btn.className = 'btn-single';
    btn.innerText = 'Download PNG';
    btn.onclick = () => {
      canvas.toBlob(blob => saveAs(blob, filename));
    };

    wrap.appendChild(canvas);
    wrap.appendChild(label);
    wrap.appendChild(btn);
    grid.appendChild(wrap);
  });
}

// =============================================================================
// BUTTONS RENDERER
// =============================================================================
const BUTTON_DEFS = [
  { id: 'btn_deal',       text: 'DEAL',        sub: '[Space]', bg1: '#15803d', bg2: '#052e16', border: '#4ade80', glow: '#22c55e' },
  { id: 'btn_hit',        text: 'HIT',         sub: '[1]',     bg1: '#1d4ed8', bg2: '#0f172a', border: '#60a5fa', glow: '#3b82f6' },
  { id: 'btn_stand',      text: 'STAND',       sub: '[2]',     bg1: '#b45309', bg2: '#451a03', border: '#fbbf24', glow: '#f59e0b' },
  { id: 'btn_double',     text: 'DOUBLE',      sub: '[3]',     bg1: '#7e22ce', bg2: '#2e1065', border: '#c084fc', glow: '#a855f7' },
  { id: 'btn_clear',      text: 'CLEAR BET',   sub: '[C]',     bg1: '#374151', bg2: '#111827', border: '#9ca3af', glow: '#6b7280' },
  { id: 'btn_endturn',    text: 'END TURN',    sub: '[Space]', bg1: '#0369a1', bg2: '#082f49', border: '#38bdf8', glow: '#0ea5e9' },
  { id: 'btn_forfeit',    text: 'FORFEIT',     sub: '[ESC]',   bg1: '#991b1b', bg2: '#450a0a', border: '#f87171', glow: '#ef4444' },
  { id: 'btn_play_table', text: 'PLAY TABLE',  sub: 'BJ 21',   bg1: '#047857', bg2: '#022c22', border: '#34d399', glow: '#10b981' },
  { id: 'btn_play_pazaak',text: 'PLAY PAZAAK', sub: 'PZ 20',   bg1: '#0284c7', bg2: '#082f49', border: '#38bdf8', glow: '#0ea5e9' }
];

function drawButton(canvas, def, isHover) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  const r = 8;

  ctx.clearRect(0, 0, w, h);

  // Background Gradient
  roundRect(ctx, 4, 4, w - 8, h - 8, r);
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, isHover ? def.border : def.bg1);
  grad.addColorStop(0.3, def.bg1);
  grad.addColorStop(1, def.bg2);
  ctx.fillStyle = grad;
  ctx.fill();

  // Glass Specular Highlight (Top Half)
  ctx.save();
  roundRect(ctx, 5, 5, w - 10, (h - 10) * 0.48, r * 0.8);
  const spec = ctx.createLinearGradient(0, 0, 0, h * 0.5);
  spec.addColorStop(0, isHover ? 'rgba(255,255,255,0.45)' : 'rgba(255,255,255,0.25)');
  spec.addColorStop(1, 'rgba(255,255,255,0.02)');
  ctx.fillStyle = spec;
  ctx.fill();
  ctx.restore();

  // Metallic Border with Glow
  ctx.save();
  roundRect(ctx, 4, 4, w - 8, h - 8, r);
  ctx.lineWidth = isHover ? 3 : 2;
  ctx.strokeStyle = def.border;
  if (isHover) {
    ctx.shadowColor = def.glow;
    ctx.shadowBlur = 12;
  }
  ctx.stroke();
  ctx.restore();

  // Inner Accent Inset
  roundRect(ctx, 8, 8, w - 16, h - 16, r * 0.6);
  ctx.lineWidth = 1;
  ctx.strokeStyle = isHover ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.15)';
  ctx.stroke();

  // Text
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Main Button Text
  ctx.font = `bold ${Math.round(h * 0.36)}px -apple-system, sans-serif`;
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = 'rgba(0,0,0,0.8)';
  ctx.shadowBlur = 4;
  ctx.fillText(def.text, w * 0.5, h * 0.44);

  // Sub Shortcut Text
  ctx.font = `bold ${Math.round(h * 0.20)}px -apple-system, sans-serif`;
  ctx.fillStyle = isHover ? '#fef08a' : '#cbd5e1';
  ctx.shadowBlur = 2;
  ctx.fillText(def.sub, w * 0.5, h * 0.78);
  ctx.shadowBlur = 0;
}

function renderButtonsTab() {
  const grid = document.getElementById('buttonsGrid');
  grid.innerHTML = '';

  BUTTON_DEFS.forEach(def => {
    // Normal State
    const wrap = document.createElement('div');
    wrap.className = 'asset-card';

    const canvas = document.createElement('canvas');
    canvas.className = 'preview-btn';
    canvas.width = 256;
    canvas.height = 76;
    drawButton(canvas, def, false);

    const filename = `${def.id}.png`;
    allAssetCanvases[def.id] = { canvas, filename, folder: 'buttons' };

    const label = document.createElement('div');
    label.className = 'asset-label';
    label.innerText = `${def.text} (Normal)`;

    const btn = document.createElement('button');
    btn.className = 'btn-single';
    btn.innerText = 'Download PNG';
    btn.onclick = () => canvas.toBlob(blob => saveAs(blob, filename));

    wrap.appendChild(canvas);
    wrap.appendChild(label);
    wrap.appendChild(btn);
    grid.appendChild(wrap);

    // Hover State
    const wrapHov = document.createElement('div');
    wrapHov.className = 'asset-card';

    const canvasHov = document.createElement('canvas');
    canvasHov.className = 'preview-btn';
    canvasHov.width = 256;
    canvasHov.height = 76;
    drawButton(canvasHov, def, true);

    const filenameHov = `${def.id}_hover.png`;
    allAssetCanvases[`${def.id}_hover`] = { canvas: canvasHov, filename: filenameHov, folder: 'buttons' };

    const labelHov = document.createElement('div');
    labelHov.className = 'asset-label';
    labelHov.innerText = `${def.text} (Hover Glow)`;

    const btnHov = document.createElement('button');
    btnHov.className = 'btn-single';
    btnHov.innerText = 'Download PNG';
    btnHov.onclick = () => canvasHov.toBlob(blob => saveAs(blob, filenameHov));

    wrapHov.appendChild(canvasHov);
    wrapHov.appendChild(labelHov);
    wrapHov.appendChild(btnHov);
    grid.appendChild(wrapHov);
  });
}

// =============================================================================
// 52 CARDS RENDERER
// =============================================================================
const SUITS = [
  { name: 'hearts', symbol: '♥', isRed: true },
  { name: 'diamonds', symbol: '♦', isRed: true },
  { name: 'clubs', symbol: '♣', isRed: false },
  { name: 'spades', symbol: '♠', isRed: false }
];

const VALUES = [
  { val: 1, label: 'A', name: 'Ace' },
  { val: 2, label: '2', name: '2' },
  { val: 3, label: '3', name: '3' },
  { val: 4, label: '4', name: '4' },
  { val: 5, label: '5', name: '5' },
  { val: 6, label: '6', name: '6' },
  { val: 7, label: '7', name: '7' },
  { val: 8, label: '8', name: '8' },
  { val: 9, label: '9', name: '9' },
  { val: 10, label: '10', name: '10' },
  { val: 11, label: 'J', name: 'Jack' },
  { val: 12, label: 'Q', name: 'Queen' },
  { val: 13, label: 'K', name: 'King' }
];

function drawCard(canvas, suit, valObj, theme) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  const r = w * 0.08;

  ctx.clearRect(0, 0, w, h);
  roundRect(ctx, 4, 4, w - 8, h - 8, r);

  if (theme === 'cantina') {
    const bgGrad = ctx.createLinearGradient(0, 0, w, h);
    bgGrad.addColorStop(0, '#1c1f26');
    bgGrad.addColorStop(1, '#0e1015');
    ctx.fillStyle = bgGrad;
    ctx.fill();

    ctx.lineWidth = Math.max(2, w * 0.02);
    ctx.strokeStyle = suit.isRed ? '#e5a93b' : '#a0aec0';
    ctx.stroke();

    roundRect(ctx, 10, 10, w - 20, h - 20, r * 0.7);
    ctx.lineWidth = 1;
    ctx.strokeStyle = suit.isRed ? 'rgba(229, 169, 59, 0.25)' : 'rgba(160, 174, 192, 0.25)';
    ctx.stroke();
  } else if (theme === 'classic') {
    const bgGrad = ctx.createLinearGradient(0, 0, w, h);
    bgGrad.addColorStop(0, '#ffffff');
    bgGrad.addColorStop(1, '#f0f2f5');
    ctx.fillStyle = bgGrad;
    ctx.fill();
    ctx.lineWidth = Math.max(2, w * 0.015);
    ctx.strokeStyle = '#cbd5e1';
    ctx.stroke();
  } else {
    const bgGrad = ctx.createLinearGradient(0, 0, w, h);
    bgGrad.addColorStop(0, '#061325');
    bgGrad.addColorStop(1, '#020912');
    ctx.fillStyle = bgGrad;
    ctx.fill();
    ctx.lineWidth = Math.max(2, w * 0.02);
    ctx.strokeStyle = suit.isRed ? '#ff0055' : '#00d2ff';
    ctx.shadowColor = suit.isRed ? '#ff0055' : '#00d2ff';
    ctx.shadowBlur = 8;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  let textColor = suit.isRed ? (theme === 'classic' ? '#dc2626' : '#ff4d6d') : (theme === 'classic' ? '#1e293b' : '#f8f9fa');
  ctx.fillStyle = textColor;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const cornerFontSize = Math.round(w * 0.14);
  const symbolFontSize = Math.round(w * 0.11);
  ctx.font = `bold ${cornerFontSize}px -apple-system, sans-serif`;
  ctx.fillText(valObj.label, w * 0.18, h * 0.14);
  ctx.font = `${symbolFontSize}px -apple-system, sans-serif`;
  ctx.fillText(suit.symbol, w * 0.18, h * 0.23);

  ctx.save();
  ctx.translate(w * 0.82, h * 0.86);
  ctx.rotate(Math.PI);
  ctx.font = `bold ${cornerFontSize}px -apple-system, sans-serif`;
  ctx.fillText(valObj.label, 0, 0);
  ctx.font = `${symbolFontSize}px -apple-system, sans-serif`;
  ctx.fillText(suit.symbol, 0, h * 0.09);
  ctx.restore();

  if (valObj.val >= 11) {
    ctx.save();
    ctx.translate(w * 0.5, h * 0.5);
    roundRect(ctx, -w * 0.25, -h * 0.22, w * 0.5, h * 0.44, r * 0.5);
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.stroke();
    ctx.font = `bold ${Math.round(w * 0.26)}px serif`;
    ctx.fillStyle = textColor;
    ctx.fillText(valObj.label, 0, -h * 0.04);
    ctx.font = `${Math.round(w * 0.22)}px -apple-system, sans-serif`;
    ctx.fillText(suit.symbol, 0, h * 0.09);
    ctx.restore();
  } else if (valObj.val === 1) {
    ctx.font = `bold ${Math.round(w * 0.42)}px -apple-system, sans-serif`;
    ctx.fillText(suit.symbol, w * 0.5, h * 0.5);
  } else {
    ctx.font = `${Math.round(w * 0.22)}px -apple-system, sans-serif`;
    ctx.fillText(suit.symbol, w * 0.5, h * 0.42);
    ctx.fillText(suit.symbol, w * 0.5, h * 0.58);
  }
}

function drawCardBack(canvas, theme) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  const r = w * 0.08;

  ctx.clearRect(0, 0, w, h);
  roundRect(ctx, 4, 4, w - 8, h - 8, r);

  const bg = ctx.createLinearGradient(0, 0, w, h);
  bg.addColorStop(0, '#741d26');
  bg.addColorStop(1, '#3b0d12');
  ctx.fillStyle = bg;
  ctx.fill();

  ctx.lineWidth = Math.max(2, w * 0.02);
  ctx.strokeStyle = '#e5a93b';
  ctx.stroke();

  roundRect(ctx, 14, 14, w - 28, h - 28, r * 0.6);
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(229, 169, 59, 0.4)';
  ctx.stroke();

  ctx.fillStyle = '#e5a93b';
  ctx.font = `bold ${Math.round(w * 0.35)}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('◈', w * 0.5, h * 0.5);
}

function renderCardsTab() {
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = '';
  const theme = document.getElementById('themeSelect').value;

  SUITS.forEach(suit => {
    VALUES.forEach(valObj => {
      const cardKey = `card_${suit.name}_${valObj.label}`;
      const wrap = document.createElement('div');
      wrap.className = 'asset-card';

      const canvas = document.createElement('canvas');
      canvas.className = 'preview-card';
      canvas.width = 256;
      canvas.height = 358;
      drawCard(canvas, suit, valObj, theme);

      allAssetCanvases[cardKey] = { canvas, filename: `${cardKey}.png`, folder: 'cards' };

      const label = document.createElement('div');
      label.className = 'asset-label';
      label.innerText = `${valObj.label} ${suit.symbol}`;

      const btn = document.createElement('button');
      btn.className = 'btn-single';
      btn.innerText = 'Download PNG';
      btn.onclick = () => canvas.toBlob(blob => saveAs(blob, `${cardKey}.png`));

      wrap.appendChild(canvas);
      wrap.appendChild(label);
      wrap.appendChild(btn);
      grid.appendChild(wrap);
    });
  });

  // Card Back
  const backWrap = document.createElement('div');
  backWrap.className = 'asset-card';
  const backCanvas = document.createElement('canvas');
  backCanvas.className = 'preview-card';
  backCanvas.width = 256;
  backCanvas.height = 358;
  drawCardBack(backCanvas, theme);
  allAssetCanvases['card_back'] = { canvas: backCanvas, filename: 'card_back.png', folder: 'cards' };

  const backLabel = document.createElement('div');
  backLabel.className = 'asset-label';
  backLabel.innerText = 'Card Back';

  const backBtn = document.createElement('button');
  backBtn.className = 'btn-single';
  backBtn.innerText = 'Download PNG';
  backBtn.onclick = () => backCanvas.toBlob(blob => saveAs(blob, 'card_back.png'));

  backWrap.appendChild(backCanvas);
  backWrap.appendChild(backLabel);
  backWrap.appendChild(backBtn);
  grid.appendChild(backWrap);
}

// =============================================================================
// CATEGORY & MASTER ZIP EXPORTERS
// =============================================================================
async function exportCategoryZip(category, zipName) {
  const statusText = document.getElementById('statusText');
  const progressWrap = document.getElementById('progressWrap');
  const progressBar = document.getElementById('progressBar');

  progressWrap.style.display = 'block';
  statusText.innerText = `Packing ${category} assets into ZIP...`;

  const zip = new JSZip();
  let keys = Object.keys(allAssetCanvases);
  if (category === 'chips') {
    keys = keys.filter(k => allAssetCanvases[k].folder === 'chips');
  } else if (category === 'buttons') {
    keys = keys.filter(k => allAssetCanvases[k].folder === 'buttons');
  } else if (category === 'both') {
    keys = keys.filter(k => allAssetCanvases[k].folder === 'chips' || allAssetCanvases[k].folder === 'buttons');
  }

  const total = keys.length;
  let done = 0;

  for (const key of keys) {
    const item = allAssetCanvases[key];
    const blob = await new Promise(resolve => item.canvas.toBlob(resolve, 'image/png'));
    zip.file(item.filename, blob);

    done++;
    const pct = Math.round((done / total) * 100);
    progressBar.style.width = pct + '%';
    statusText.innerText = `Adding ${category} to ZIP: ${done}/${total} (${pct}%)`;
  }

  statusText.innerText = `Compressing and downloading ${zipName}...`;
  const content = await zip.generateAsync({ type: 'blob' }, metadata => {
    progressBar.style.width = metadata.percent + '%';
  });

  saveAs(content, zipName);
  statusText.innerText = `Export complete! Downloaded ${total} ${category} assets.`;
  setTimeout(() => { progressWrap.style.display = 'none'; }, 2500);
}

async function exportMasterZip() {
  await exportCategoryZip('all', 'cantina_casino_ui_pack.zip');
}

window.onload = () => {
  renderChipsTab();
  renderButtonsTab();
  renderCardsTab();
};
